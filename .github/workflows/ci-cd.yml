name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Runs of one kind on one ref execute one after the other, so an older push
# can never finish after a newer one and overwrite its image tag. Only a newer
# push to a pull request cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv pip install --system --require-hashes -r requirements-dev.lock
      - name: Check code style (Ruff)
        run: ruff check --output-format github .
      - name: Check formatting (Ruff)
        run: ruff format --check .
      - name: Check router separation of concerns
        run: python scripts/check_router_soc.py

  quality:
    name: Typecheck, Migrations & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      # A syntactically valid but never-actually-contacted value is enough:
      # the ARQ Valkey pool is a lazy singleton (see app/core/arq_pool.py),
      # so nothing connects to it unless a test explicitly exercises an
      # enqueue path (those tests mock the pool) - no `services: valkey:`
      # container needed here.
      VALKEY_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-minimum-32-chars!!
      APP_ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:20001
      S3_ENDPOINT_URL: https://s3.amazonaws.com
      S3_ACCESS_KEY: testing
      S3_SECRET_KEY: testing
      S3_BUCKET: test-bucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install system dependencies (for Cairo/PDF)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 \
            libharfbuzz-subset0
      - name: Install Python dependencies
        run: uv pip install --system --require-hashes -r requirements-dev.lock
      - name: Run Pyright (Strict Type Checking)
        run: pyright
      - name: Run Database Migrations
        run: alembic upgrade head
      - name: Run Test Suite & Coverage
        run: pytest --tb=short -q
      - name: Check Statement and Branch Coverage
        run: python scripts/check_coverage_gate.py

  security:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv pip install --system --require-hashes -r requirements-dev.lock
      # The locks pin every version, so a published advisory for a pinned
      # version fails this job. The weekly schedule reports advisories that
      # appear after the last change. To accept one with a written reason
      # while no fixed version exists, add `--ignore-vuln <ID>` to the command.
      - name: Audit the locked dependencies for known vulnerabilities
        run: |
          pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
          pip-audit -r requirements-dev.lock --no-deps --disable-pip --progress-spinner off

  smoke-test-readonly:
    name: Read-Only Rootfs Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # A real instance (not a fake URL like the quality job uses) is
      # needed here: unlike the web app's lazily-connecting ARQ pool, the
      # `arq` worker process itself connects on startup to poll for jobs.
      valkey:
        image: docker.io/valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      VALKEY_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-minimum-32-chars!!
      APP_ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:20001
      S3_ENDPOINT_URL: https://s3.amazonaws.com
      S3_ACCESS_KEY: testing
      S3_SECRET_KEY: testing
      S3_BUCKET: test-bucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: prod
          push: false
          load: true
          tags: vb-api:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirrors the Quadlet hardening applied in the deploy repo's
      # templates: read-only rootfs, only /tmp writable as tmpfs, no
      # capabilities, no privilege escalation. Proves the image actually
      # boots under those constraints instead of just assuming it from
      # reading the code.
      - name: Boot the web container read-only
        run: |
          docker run -d --name vb-api-smoke \
            --read-only --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --network host \
            -e DATABASE_URL -e VALKEY_URL -e SECRET_KEY -e APP_ENVIRONMENT \
            -e CORS_ORIGINS -e S3_ENDPOINT_URL -e S3_ACCESS_KEY -e S3_SECRET_KEY \
            -e S3_BUCKET \
            vb-api:smoke-test

      - name: Wait for the web container's health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              echo "Web container healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 1
          done
          echo "Web container never became healthy within 30s." >&2
          exit 1

      - name: Boot the worker container read-only
        if: always()
        run: |
          docker run -d --name vb-api-smoke-worker \
            --read-only --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --network host \
            -e SKIP_MIGRATIONS=true \
            -e DATABASE_URL -e VALKEY_URL -e SECRET_KEY -e APP_ENVIRONMENT \
            -e CORS_ORIGINS -e S3_ENDPOINT_URL -e S3_ACCESS_KEY -e S3_SECRET_KEY \
            -e S3_BUCKET \
            vb-api:smoke-test arq app.worker.WorkerSettings
          sleep 10

      - name: Check both containers' logs for read-only filesystem errors
        if: always()
        run: |
          docker logs vb-api-smoke > web.log 2>&1 || true
          docker logs vb-api-smoke-worker > worker.log 2>&1 || true
          echo "--- web container log ---"
          cat web.log
          echo "--- worker container log ---"
          cat worker.log
          if grep -iE "EROFS|read-only file system|permission denied" web.log worker.log; then
            echo "Found a read-only filesystem error above." >&2
            exit 1
          fi

      - name: Clean up test containers
        if: always()
        run: docker rm -f vb-api-smoke vb-api-smoke-worker || true

  release-image:
    name: Build & Push Image
    needs: [lint, quality, security, dependency-audit, smoke-test-readonly]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/k-o-st-v-vindobona-ii/vb-api:latest
            ghcr.io/k-o-st-v-vindobona-ii/vb-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
