repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682  # frozen: v0.16.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # The repository is public: environment files and shell history must
      # never be committed (a history file once was). The example file stays.
      - id: forbid-secret-files
        name: Forbid environment files and shell history
        entry: "Environment files and shell history must not be committed"
        language: fail
        files: '(^|/)(\.env(\..+)?|\.bash_history)$'
        exclude: '(^|/)\.env\.example$'

      - id: check-router-soc
        name: Router Separation-of-Concerns Check
        entry: podman exec vb-api python scripts/check_router_soc.py
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: Pyright Strict Type Checking
        entry: podman exec vb-api python -m pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Pytest & Code Coverage
        # Runs against a dedicated vb_test database, never the real dev DB
        # — see scripts/run_pytest.sh and "Tests" in README.md.
        entry: podman exec vb-api sh scripts/run_pytest.sh
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
